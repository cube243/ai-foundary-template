# Deploys shared-infra/cognito (the auth foundation every agent's Cognito
# app client is created under).
#
# Required repository variables (Settings > Secrets and variables > Actions
# > Variables), all produced by shared-infra/bootstrap/scripts/bootstrap.bat:
#   AWS_REGION            e.g. ap-northeast-1
#   AWS_DEPLOY_ROLE_ARN   terraform output -raw github_actions_role_arn
#   TF_STATE_BUCKET       terraform output -raw state_bucket_name
#   TF_STATE_LOCK_TABLE   terraform output -raw state_lock_table_name

name: shared-infra / cognito

on:
  pull_request:
    paths:
      - "shared-infra/cognito/**"
  push:
    branches: [main]
    paths:
      - "shared-infra/cognito/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_region: ${{ vars.AWS_REGION }}

defaults:
  run:
    working-directory: shared-infra/cognito

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -input=false

      - name: terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve
